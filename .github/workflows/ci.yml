name: CI

# CI-пайплайн Tab Rotator:
# * запускается на любой pull request в основную ветку,
# * запускается на push в основную ветку (после merge PR),
# * может быть вызван как reusable workflow из release.yml, чтобы не
#   дублировать логику валидации и сборки.
#
# Задачи job-а `build`:
#   1. Проверить JSON и JS-исходники расширения.
#   2. Собрать релизный ZIP через scripts/package.sh
#      (там же валидируются version и обязательные runtime-файлы).
#   3. Выгрузить ZIP как артефакт, чтобы release.yml мог его переиспользовать.
#
# Workflow пригоден для branch protection: его можно сделать required check.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    outputs:
      version:
        description: "Версия расширения, прочитанная из manifest.json."
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: "Имя artifact-а со собранным ZIP."
        value: ${{ jobs.build.outputs.artifact-name }}

# Для одной ветки/PR одновременно выполняется только один прогон CI —
# предыдущий отменяется, чтобы не держать очередь и не расходовать
# минуты на устаревшие коммиты. Для push в main отмены не делаем,
# чтобы не прерывать сборку, от которой зависит релиз.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Валидация и сборка ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.artifact-meta.outputs.version }}
      artifact-name: ${{ steps.artifact-meta.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка zip/unzip
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends zip unzip

      - name: Проверить исходники расширения
        run: |
          set -euo pipefail
          # Проверяем manifest + локализации как JSON и runtime-скрипты
          # через node --check. Это покрывает синтаксис исходников, а
          # package.sh ниже отвечает уже за релизные инварианты и ZIP.
          json_files=(
            manifest.json
            _locales/en/messages.json
            _locales/ru/messages.json
            _locales/uz/messages.json
          )
          js_files=(
            background.js
            popup.js
          )
          fail=0
          for f in "${json_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::Файл не найден"
              fail=1
              continue
            fi
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"; then
              echo "::error file=$f::Невалидный JSON"
              fail=1
            else
              echo "ok: $f"
            fi
          done
          for f in "${js_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::Файл не найден"
              fail=1
              continue
            fi
            if ! node --check "$f"; then
              echo "::error file=$f::Невалидный JavaScript"
              fail=1
            else
              echo "ok: $f"
            fi
          done
          exit "$fail"

      - name: Собрать релизный ZIP
        run: bash scripts/package.sh

      - name: Подготовить метаданные артефакта
        id: artifact-meta
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          if [[ -z "${version}" ]]; then
            echo "::error::Не удалось прочитать version из manifest.json после сборки"
            exit 1
          fi
          zip_path="dist/tab-rotator-${version}.zip"
          if [[ ! -f "$zip_path" ]]; then
            echo "::error::Ожидаемый ZIP не создан: $zip_path"
            exit 1
          fi
          echo "Собран: $zip_path ($(wc -c < "$zip_path") байт)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=tab-rotator-${version}" >> "$GITHUB_OUTPUT"

      - name: Загрузить ZIP как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: dist/tab-rotator-${{ steps.artifact-meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
