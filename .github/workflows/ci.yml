name: CI
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      zip-sha256:
        value: ${{ jobs.build.outputs.zip-sha256 }}
permissions:
  contents: read
jobs:
  build:
    name: Валидация и сборка ZIP
    if: >-
      ${{ github.repository == 'Sherzod-Norkulov/tab-rotator' && github.repository_id == '1114674208' &&
          github.event.repository.private == false && github.event.repository.owner.login == 'Sherzod-Norkulov' &&
          github.actor == 'Sherzod-Norkulov' && github.triggering_actor == 'Sherzod-Norkulov' &&
          ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
           (github.event_name == 'pull_request' && github.base_ref == 'main' &&
            github.event.pull_request.user.login == 'Sherzod-Norkulov' &&
            github.event.pull_request.head.repo.id == 1114674208 && github.event.pull_request.head.repo.fork == false &&
            github.event.pull_request.base.repo.id == 1114674208)) }}
    runs-on: [self-hosted, linux, x64, tab-rotator-vm]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      zip-sha256: ${{ steps.build.outputs.zip-sha256 }}
    defaults:
      run:
        working-directory: ci-${{ github.run_id }}-${{ github.run_attempt }}-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-build
          fetch-depth: 0
          persist-credentials: false
      - name: Проверить и собрать один ZIP с checksum на ВМ
        id: build
        run: /usr/local/bin/github-vm-job -- bash scripts/ci/validate.sh
