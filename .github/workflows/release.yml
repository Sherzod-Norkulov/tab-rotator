name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ci:
    name: CI (обязательные проверки)
    if: ${{ github.repository == 'Sherzod-Norkulov/tab-rotator' && github.repository_id == '1114674208' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'Sherzod-Norkulov' && github.triggering_actor == 'Sherzod-Norkulov' }}
    uses: ./.github/workflows/ci.yml
  release:
    name: Публикация GitHub Release
    needs: ci
    runs-on: [self-hosted, linux, x64, tab-rotator-vm]
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ci-${{ github.run_id }}-${{ github.run_attempt }}-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-release
          fetch-depth: 0
          persist-credentials: false
      - name: Проверить версию и существующий тег
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.ci.outputs.version }}
        run: python3 -I -B scripts/ci/release-state.py
      - name: Получить проверенный ZIP этого же build
        if: steps.state.outputs.release_exists == 'false'
        env:
          EXPECTED_VERSION: ${{ needs.ci.outputs.version }}
          EXPECTED_ZIP_SHA256: ${{ needs.ci.outputs.zip-sha256 }}
        run: python3 -I -B scripts/ci/artifact.py restore
      - name: Создать аннотированный тег на точном source
        if: steps.state.outputs.release_exists == 'false' && steps.state.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          set -euo pipefail
          object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Tab Rotator $TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
      - name: Опубликовать ZIP без повторной сборки
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" 'BEGIN {found=0} /^## \[/ {if(found)exit; if(index($0,"["v"]")){found=1;next}} found {print}' CHANGELOG.md >release_notes.md
          if ! test -s release_notes.md; then printf 'Tab Rotator %s\n' "$TAG" >release_notes.md; fi
          gh release create "$TAG" "dist/tab-rotator-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --title "Tab Rotator $TAG" --notes-file release_notes.md --verify-tag
      - name: Подтвердить существующий релиз
        if: steps.state.outputs.release_exists == 'true'
        run: echo 'Версия уже опубликована; существующие тег и релиз сохранены.'
