<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Rotator</title>
  <style>
    :root {
      --bg: #fbf8f3;
      --panel: rgba(255, 252, 247, 0.96);
      --header-bg: rgba(251, 248, 243, 0.95);
      --field: #fffdf9;
      --field-muted: #eef1f0;
      --button-secondary: #fff6ec;
      --border: #e9ddcf;
      --accent: #d8c3f3;
      --accent-strong: #9f86d9;
      --accent-soft: #f3edf9;
      --accent-contrast: #1f2937;
      --primary-bg: linear-gradient(135deg, var(--accent), var(--accent-strong));
      --primary-text: #1f2937;
      --text: #1f2937;
      --muted: #6b7280;
      --error: #b94a48;
      --ok: #267a61;
      --status-neutral: #6b7280;
      --danger-bg: linear-gradient(135deg, #f6c7c3, #eba4a0);
      --danger-text: #5f1f1c;
      --danger-border: #e6aaa5;
      --remove-bg: #fff0ef;
      --remove-text: #8f2e2b;
      --disabled-bg: #e8e6e2;
      --disabled-text: #8d8a85;
      --footer-bg: linear-gradient(135deg, rgba(216, 195, 243, 0.2), rgba(186, 230, 253, 0.18));
      --footer-hover-bg: linear-gradient(135deg, rgba(216, 195, 243, 0.3), rgba(186, 230, 253, 0.28));
      --focus-ring: rgba(95, 111, 159, 0.45);
      --shadow: 0 8px 22px rgba(166, 137, 109, 0.14);
    }

    body.dark,
    body[data-scheme="dark"] {
      --bg: #171924;
      --panel: rgba(31, 34, 48, 0.96);
      --header-bg: rgba(23, 25, 36, 0.96);
      --field: #101421;
      --field-muted: #252938;
      --button-secondary: #252938;
      --border: #3f4354;
      --accent: #cab8f1;
      --accent-strong: #e4d8ff;
      --accent-soft: #2b2e40;
      --accent-contrast: #151824;
      --primary-bg: linear-gradient(135deg, var(--accent), var(--accent-strong));
      --primary-text: #151824;
      --text: #f4f2ec;
      --muted: #b5bdc9;
      --error: #ffb4ad;
      --ok: #a8e6cf;
      --status-neutral: #c9ced8;
      --danger-bg: linear-gradient(135deg, #7d3432, #9f514c);
      --danger-text: #fff7f4;
      --danger-border: #a85a54;
      --remove-bg: #3a2427;
      --remove-text: #ffc5be;
      --disabled-bg: #303442;
      --disabled-text: #8f98a8;
      --footer-bg: linear-gradient(135deg, rgba(202, 184, 241, 0.16), rgba(125, 179, 197, 0.12));
      --footer-hover-bg: linear-gradient(135deg, rgba(202, 184, 241, 0.24), rgba(125, 179, 197, 0.2));
      --focus-ring: rgba(228, 216, 255, 0.5);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    body[data-tone="mint"][data-scheme="light"] {
      --accent: #bfe8d7;
      --accent-strong: #78bfa3;
      --accent-soft: #edf8f2;
      --button-secondary: #f2fbf6;
      --footer-bg: linear-gradient(135deg, rgba(191, 232, 215, 0.28), rgba(207, 236, 231, 0.22));
      --footer-hover-bg: linear-gradient(135deg, rgba(191, 232, 215, 0.42), rgba(207, 236, 231, 0.34));
    }

    body[data-tone="mint"][data-scheme="dark"] {
      --accent: #9edec2;
      --accent-strong: #c7f2df;
      --accent-soft: #20362f;
    }

    body[data-tone="peach"][data-scheme="light"] {
      --accent: #f4c7aa;
      --accent-strong: #d99a77;
      --accent-soft: #fff1e8;
      --button-secondary: #fff5ed;
      --footer-bg: linear-gradient(135deg, rgba(244, 199, 170, 0.3), rgba(250, 221, 191, 0.24));
      --footer-hover-bg: linear-gradient(135deg, rgba(244, 199, 170, 0.43), rgba(250, 221, 191, 0.34));
    }

    body[data-tone="peach"][data-scheme="dark"] {
      --accent: #efb995;
      --accent-strong: #ffd9bd;
      --accent-soft: #3b2b25;
    }

    body[data-tone="sky"][data-scheme="light"] {
      --accent: #b9daf5;
      --accent-strong: #7aaed8;
      --accent-soft: #eef7ff;
      --button-secondary: #f1f8fe;
      --footer-bg: linear-gradient(135deg, rgba(185, 218, 245, 0.34), rgba(203, 232, 241, 0.22));
      --footer-hover-bg: linear-gradient(135deg, rgba(185, 218, 245, 0.46), rgba(203, 232, 241, 0.34));
    }

    body[data-tone="sky"][data-scheme="dark"] {
      --accent: #9ccbf0;
      --accent-strong: #cde8ff;
      --accent-soft: #213243;
    }

    body[data-tone="rose"][data-scheme="light"] {
      --accent: #efc6d3;
      --accent-strong: #cf8fa7;
      --accent-soft: #fff0f5;
      --button-secondary: #fff5f8;
      --footer-bg: linear-gradient(135deg, rgba(239, 198, 211, 0.32), rgba(241, 220, 228, 0.24));
      --footer-hover-bg: linear-gradient(135deg, rgba(239, 198, 211, 0.44), rgba(241, 220, 228, 0.34));
    }

    body[data-tone="rose"][data-scheme="dark"] {
      --accent: #ecb5c8;
      --accent-strong: #ffd8e4;
      --accent-soft: #3b2732;
    }

    body[data-tone="sage"][data-scheme="light"] {
      --accent: #d5dfbd;
      --accent-strong: #9cad77;
      --accent-soft: #f5f8ed;
      --button-secondary: #f8faef;
      --footer-bg: linear-gradient(135deg, rgba(213, 223, 189, 0.34), rgba(230, 226, 204, 0.24));
      --footer-hover-bg: linear-gradient(135deg, rgba(213, 223, 189, 0.46), rgba(230, 226, 204, 0.34));
    }

    body[data-tone="sage"][data-scheme="dark"] {
      --accent: #cbd9aa;
      --accent-strong: #e7f2c8;
      --accent-soft: #303729;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      font-family: "Nunito Sans", "Aptos Rounded", "Avenir Next", "Trebuchet MS", sans-serif;
      background: radial-gradient(circle at 12% 16%, rgba(124, 156, 245, 0.22), transparent 32%),
                  radial-gradient(circle at 82% 8%, rgba(244, 194, 194, 0.2), transparent 32%),
                  radial-gradient(circle at 76% 72%, rgba(186, 230, 253, 0.16), transparent 32%),
                  var(--bg);
      color: var(--text);
      color-scheme: light;
      min-width: 320px;
      max-width: 380px;
    }

    body[data-scheme="dark"] {
      color-scheme: dark;
    }

    h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: 0.2px; }
    .subtitle { margin: 0 0 8px; color: var(--muted); font-size: 12px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-top: 7px;
      box-shadow: var(--shadow);
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    label .title { flex: 1; white-space: nowrap; }

    .suffix {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    input[type="number"] {
      width: 82px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font-weight: 600;
    }

    input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); transform: scale(1.05); }
    body.dark input,
    body.dark select,
    body.dark .entry input[type="text"],
    body.dark .row input[type="text"],
    body[data-scheme="dark"] input,
    body[data-scheme="dark"] select,
    body[data-scheme="dark"] .entry input[type="text"],
    body[data-scheme="dark"] .row input[type="text"] {
      background: var(--field);
      color: var(--text);
      border-color: var(--border);
    }

    .actions { display: flex; gap: 8px; margin-top: 8px; }

    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: transform 0.08s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.primary {
      background: var(--primary-bg);
      color: var(--primary-text);
      box-shadow: 0 10px 24px rgba(124, 156, 245, 0.35);
    }

    button.secondary { background: var(--button-secondary); color: var(--text); border: 1px solid var(--border); }
    button.small { flex: 0; padding: 6px 8px; font-weight: 600; }
    button:hover { transform: translateY(-1px); }
    button:disabled {
      background: var(--disabled-bg) !important;
      color: var(--disabled-text) !important;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    button.danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      box-shadow: 0 10px 24px rgba(116, 64, 60, 0.18);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .import-btn:focus-within {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    #status { margin-top: 10px; font-weight: 700; font-size: 13px; }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }
    #status.neutral { color: var(--status-neutral); }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      margin: -10px -10px 0;
      padding: 8px 8px 7px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 6px 12px rgba(76, 103, 186, 0.08);
      border-radius: 0 0 12px 12px;
    }

    .sticky-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sticky-top #status { flex: 1; }
    .sticky-top .icon-btn { flex: 0 0 auto; }

    .sticky-header #status { margin-top: 0; }
    .sticky-header .actions { margin-top: 8px; }

    .footer {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--footer-bg);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .footer:hover {
      background: var(--footer-hover-bg);
      border-color: var(--accent);
    }

    .footer-icon {
      width: 18px;
      height: 18px;
      color: var(--accent-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .footer-icon svg {
      width: 18px;
      height: 18px;
    }

    .footer-name {
      color: var(--accent-strong);
      font-weight: 700;
      border-bottom: 1px solid var(--accent);
    }

    .footer-version {
      margin-left: 6px;
      font-weight: 600;
      font-size: 11px;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--field);
      border: 1px solid var(--border);
    }

    .footer:hover .footer-name {
      color: var(--accent-strong);
    }

    /* Entries */
    .entry {
      display: grid;
      grid-template-columns: 54px 1fr;
      grid-template-areas:
        "order name"
        "url url"
        "controls controls";
      gap: 6px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--accent-soft);
      margin-bottom: 8px;
    }

    .entry input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
    }

    .entry .entry-name {
      grid-area: name;
    }

    .entry .entry-url {
      grid-area: url;
      grid-column: 1 / -1;
    }

    .entry .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .entry .timer {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .entry .timer input[type="number"] {
      width: 70px;
      padding: 6px 8px;
      border-radius: 10px;
      background: var(--field);
    }

    .entry .remove {
      background: var(--remove-bg);
      color: var(--remove-text);
      border: 1px solid var(--danger-border);
      margin-left: auto;
    }

    .entry .remove:hover { transform: translateY(-1px); }

    .entry-controls {
      grid-area: controls;
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-template-rows: auto auto auto auto;
      gap: 6px 8px;
      align-items: center;
      grid-template-areas:
        "olabel . ocheck"
        "rlabel rinput rcheck"
        "tlabel tinput tcheck"
        "remove remove remove";
    }
    .control-label { font-size: 12px; color: var(--text); }
    .suffix-input {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .suffix-input input {
      width: 80px;
      padding-right: 32px;
      text-align: center;
    }
    .suffix-input .suffix-label {
      position: absolute;
      right: 8px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .order-controls {
      grid-area: order;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 60px;
      align-self: center;
    }

    .order-buttons {
      display: flex;
      flex-direction: row;
      gap: 2px;
      align-items: center;
    }

    .order-controls button {
      padding: 0;
      min-width: 0;
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 9px;
    }

    .order-btn {
      background: var(--field);
      border: 1px solid var(--border);
      color: var(--muted);
      box-shadow: none;
    }

    .order-btn:hover:not(:disabled) {
      background: var(--button-secondary);
      color: var(--text);
    }

    .order-label {
      width: auto;
      min-width: 14px;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      padding-top: 0;
    }

    .order-controls svg {
      width: 16px;
      height: 16px;
    }

    .field-enabled {
      background: var(--field) !important;
    }

    .field-disabled {
      background: var(--field-muted) !important;
    }

    .inline-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .inline-pair {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .row input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
    }

    .profile-grid { display: block; margin-top: 8px; }
    .profile-grid select { width: 100%; }

    .profile-actions {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow: hidden;
      margin-top: 12px;
      justify-content: space-between;
    }

    select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      min-width: 160px;
    }

    .theme-tone-select {
      min-width: 150px;
      max-width: 170px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .import-btn input[type="file"] { display: none; }
    .import-btn {
      background: var(--button-secondary);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .icon-btn {
      flex: 1;
      min-width: 40px;
      max-width: 40px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      border-radius: 10px;
      background: var(--button-secondary);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .task-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 112px;
      overflow: auto;
    }

    .task-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--accent-soft);
      font-size: 12px;
    }

    .task-item .task-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    #excludeDomains,
    #noRefreshDomains {
      background: var(--field);
      color: var(--text);
    }

    .btn-icon svg,
    .icon-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes flash {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(124,156,245,0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 18px rgba(124,156,245,0.4); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(124,156,245,0); }
    }
    .flash {
      animation: flash 0.45s ease;
    }

    #addEntry {
      padding: 6px 10px;
      font-size: 13px;
    }

    .compact-actions {
      margin: 0 0 8px;
    }

    .compact-actions button {
      flex: 1;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sticky-header">
    <div class="sticky-top">
      <div id="status" role="status" aria-live="polite"></div>
      <button id="darkModeToggle" class="icon-btn" data-i18n="title_dark_mode" data-i18n-attr="title,aria-label">☾</button>
      <button id="openInWindow" class="icon-btn" data-i18n="title_open_in_window" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="48" stroke-dashoffset="48" d="M11 5h-6v14h14v-6"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="48;0"/></path><path stroke-dasharray="12" stroke-dashoffset="12" d="M13 11l7 -7"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.6s" dur="0.2s" values="12;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M21 3h-6M21 3v6"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.8s" dur="0.2s" values="8;0"/></path></g></svg>
      </button>
    </div>
    <div class="actions">
      <button id="start" class="primary">
        <span class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-dasharray="40" stroke-dashoffset="40" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6l10 6l-10 6Z"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.5s" values="40;0"/></path></svg>
        </span>
        <span data-i18n="start"></span>
      </button>
      <button id="stop" class="secondary">
        <span class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-dasharray="32" stroke-dashoffset="32" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M7 6h2v12h-2Z"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="32;0"/></path><path d="M15 6h2v12h-2Z"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.4s" values="32;0"/></path></g></svg>
        </span>
        <span data-i18n="stop"></span>
      </button>
    </div>
  </div>

  <div class="card">
    <label>
      <span class="title" data-i18n="label_interval"></span>
      <div style="display:flex;align-items:center;gap:6px;">
        <input id="interval" type="number" min="1" step="1" value="5" />
        <span class="suffix" data-i18n="suffix_seconds"></span>
      </div>
    </label>
    <label>
      <span class="title" data-i18n="label_autostart"></span>
      <input id="autoStart" type="checkbox" />
    </label>
    <label>
      <span class="title" data-i18n="label_pause_policy"></span>
      <select id="pausePolicy">
        <option value="never" data-i18n="option_pause_never"></option>
        <option value="active" data-i18n="option_pause_active"></option>
        <option value="idle" data-i18n="option_pause_idle"></option>
      </select>
    </label>
    <label>
      <span class="title" data-i18n="label_theme_tone"></span>
      <select id="themeTone" class="theme-tone-select">
        <option value="lavender" data-i18n="theme_tone_lavender"></option>
        <option value="mint" data-i18n="theme_tone_mint"></option>
        <option value="peach" data-i18n="theme_tone_peach"></option>
        <option value="sky" data-i18n="theme_tone_sky"></option>
        <option value="rose" data-i18n="theme_tone_rose"></option>
        <option value="sage" data-i18n="theme_tone_sage"></option>
      </select>
    </label>
  </div>

  <div class="card">
    <div class="profile-grid">
      <select id="profileSelect"></select>
    </div>
    <div class="profile-actions">
      <button id="applyProfile" class="secondary small icon-btn" data-i18n="title_apply" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><mask id="mask-check-all"><g fill="none" stroke="#fff" stroke-dasharray="24" stroke-dashoffset="24" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M2 13.5l4 4l10.75 -10.75"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="24;0"/></path><path stroke="#000" stroke-width="6" d="M7.5 13.5l4 4l10.75 -10.75"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.4s" values="24;0"/></path><path d="M7.5 13.5l4 4l10.75 -10.75"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.4s" values="24;0"/></path></g></mask><rect width="24" height="24" fill="currentColor" mask="url(#mask-check-all)"/></svg>
      </button>
      <button id="saveProfile" class="secondary small icon-btn" data-i18n="title_save" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="72" stroke-dashoffset="72" d="M12 3h7v18h-14v-18h7Z"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="72;0"/></path><path stroke-dasharray="12" stroke-dashoffset="12" stroke-width="1" d="M14.5 3.5v3h-5v-3"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.7s" dur="0.2s" values="12;0"/></path><path stroke-dasharray="10" stroke-dashoffset="10" d="M9 13l2 2l4 -4"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.9s" dur="0.2s" values="10;0"/></path></g></svg>
      </button>
      <button id="saveAsProfile" class="secondary small icon-btn" data-i18n="title_save_as" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="64" stroke-dashoffset="64" d="M13 3l6 6v12h-14v-18h8"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="64;0"/></path><path stroke-dasharray="14" stroke-dashoffset="14" stroke-width="1" d="M12.5 3v5.5h6.5"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.7s" dur="0.2s" values="14;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M9 14h6"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.9s" dur="0.2s" values="8;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M12 11v6"><animate fill="freeze" attributeName="stroke-dashoffset" begin="1.1s" dur="0.2s" values="8;0"/></path></g></svg>
      </button>
      <button id="duplicateProfile" class="secondary small icon-btn" data-i18n="title_duplicate" data-i18n-attr="title,aria-label">⧉</button>
      <button id="editProfile" class="secondary small icon-btn" data-i18n="title_edit" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="56" stroke-dashoffset="56" d="M3 21l2 -6l11 -11c1 -1 3 -1 4 0c1 1 1 3 0 4l-11 11l-6 2"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="56;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M15 5l4 4"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.6s" dur="0.2s" values="8;0"/></path><path stroke-dasharray="6" stroke-dashoffset="6" stroke-width="1" d="M6 15l3 3"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.6s" dur="0.2s" values="6;0"/></path></g></svg>
      </button>
      <button id="deleteProfile" class="secondary small icon-btn" data-i18n="title_delete" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="24" stroke-dashoffset="24" d="M12 20h5c0.5 0 1 -0.5 1 -1v-14M12 20h-5c-0.5 0 -1 -0.5 -1 -1v-14"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="24;0"/></path><path stroke-dasharray="20" stroke-dashoffset="20" d="M4 5h16"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.2s" values="20;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M10 4h4M10 9v7M14 9v7"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.6s" dur="0.2s" values="8;0"/></path></g></svg>
      </button>
      <button id="exportProfile" class="secondary small icon-btn" data-i18n="title_export" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="currentColor" fill-opacity="0" stroke-dasharray="20" stroke-dashoffset="20" d="M12 4h2v6h2.5l-4.5 4.5M12 4h-2v6h-2.5l4.5 4.5"><animate fill="freeze" attributeName="fill-opacity" begin="0.7s" dur="0.5s" values="0;1"/><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="20;0"/></path><path stroke-dasharray="14" stroke-dashoffset="14" d="M6 19h12"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.5s" dur="0.2s" values="14;0"/></path></g></svg>
      </button>
      <label class="secondary small icon-btn import-btn" style="cursor:pointer;" data-i18n="title_import" data-i18n-attr="title,aria-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="currentColor" fill-opacity="0" stroke-dasharray="20" stroke-dashoffset="20" d="M12 15h2v-6h2.5l-4.5 -4.5M12 15h-2v-6h-2.5l4.5 -4.5"><animate fill="freeze" attributeName="fill-opacity" begin="0.7s" dur="0.5s" values="0;1"/><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="20;0"/></path><path stroke-dasharray="14" stroke-dashoffset="14" d="M6 19h12"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.5s" dur="0.2s" values="14;0"/></path></g></svg>
        <input id="importProfile" type="file" accept="application/json" />
      </label>
    </div>
  </div>

  <div class="card">
    <label>
      <span class="title" data-i18n="label_use_custom_list"></span>
      <input id="useCustomList" type="checkbox" />
    </label>

    <div id="entries"></div>
    <div class="actions compact-actions">
      <button id="addEntry" class="secondary small">
        <span class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-dasharray="16" stroke-dashoffset="16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M5 12h14"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="16;0"/></path><path d="M12 5v14"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.4s" values="16;0"/></path></g></svg>
        </span>
        <span data-i18n="button_add_entry"></span>
      </button>
      <button id="loadOpenTabs" class="secondary small" data-i18n="button_load_open_tabs"></button>
    </div>

    <div class="inline-controls" style="flex-direction:column; gap:10px; margin-top:6px;">
      <div class="inline-pair">
        <span class="title" data-i18n="label_open_tabs"></span>
        <input id="openCustomTabs" type="checkbox" />
      </div>
      <div class="inline-pair">
        <span class="title" data-i18n="label_dedicated_window"></span>
        <input id="useDedicatedWindow" type="checkbox" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px; align-items:center;">
      <strong class="pill" data-i18n="pill_exclude"></strong>
      <label style="display:flex;align-items:center;gap:8px; margin:0;">
        <span class="title" style="font-size:12px;" data-i18n="label_enable"></span>
        <input id="excludeToggle" type="checkbox" />
      </label>
    </div>
    <input id="excludeDomains" type="text" placeholder="" data-i18n="placeholder_exclude" data-i18n-attr="placeholder" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);" />
    <div class="row" style="margin-top:10px; margin-bottom:8px; align-items:center;">
      <strong class="pill" data-i18n="pill_no_refresh"></strong>
    </div>
    <input id="noRefreshDomains" type="text" placeholder="" data-i18n="placeholder_no_refresh" data-i18n-attr="placeholder" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);" />
  </div>

  <div class="card">
    <strong class="pill" data-i18n="pill_extra"></strong>
    <div class="inline-controls" style="margin-top:8px;">
      <label style="margin:0; flex:1;">
        <span class="title" data-i18n="label_badge"></span>
        <input id="badgeCountdown" type="checkbox" />
      </label>
      <label style="margin:0; flex:1;">
        <span class="title" data-i18n="label_order"></span>
        <select id="orderMode">
          <option value="sequential" data-i18n="option_sequential"></option>
          <option value="shuffle" data-i18n="option_shuffle"></option>
        </select>
      </label>
      <label style="margin:0; flex:1 1 100%;">
        <span class="title" data-i18n="label_allow_popup_rotation"></span>
        <input id="allowRotationWhilePopupOpen" type="checkbox" />
      </label>
    </div>
  </div>

  <div class="card">
    <strong class="pill" data-i18n="pill_auto_refresh"></strong>
    <div class="row" style="margin-top:8px;">
      <span class="title" data-i18n="label_refresh_interval"></span>
      <div style="display:flex;align-items:center;gap:6px;">
        <input id="refreshInterval" type="number" min="1" step="1" value="120" />
        <span class="suffix" data-i18n="suffix_seconds"></span>
      </div>
    </div>
    <div id="activeTabUrl" class="task-url" style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
    <div class="actions">
      <button id="startRefreshCurrent" class="secondary small" data-i18n="button_refresh_current"></button>
      <button id="resetRefreshTasks" class="secondary small" data-i18n="button_refresh_reset"></button>
    </div>
    <div id="refreshTasks" class="task-list"></div>
  </div>
